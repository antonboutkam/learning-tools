<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stappenplan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stappenplan">
    <h1 id="title" hidden></h1>
    <p id="status" role="status">Stappenplan laden…</p>
    <div id="viewer" hidden>
      <section aria-live="polite" aria-atomic="true">
        <p id="stepNumber" class="step-number"></p>
        <div id="imageContainer" class="image-container"></div>
        <p id="imageStatus" class="image-status" hidden></p>
        <p id="description" class="description"></p>
      </section>
      <nav aria-label="Stappen doorlopen">
        <button id="previousButton" type="button" disabled>← Vorige</button>
        <button id="nextButton" type="button" disabled>Volgende →</button>
      </nav>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>

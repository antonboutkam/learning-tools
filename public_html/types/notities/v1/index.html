<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notities</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="top__left">
        <div class="title" id="title">Notities</div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="top__right">
        <button class="btn" id="prevBtn" type="button">Vorige</button>
        <button class="btn" id="nextBtn" type="button">Volgende</button>
        <span class="pill" id="pagePill">1 / 100</span>
        <button class="btn" id="modeBtn" type="button" title="Wissel tussen typen en pen">Typen</button>
        <label class="field">
          <span class="field__label">Dikte</span>
          <input class="range" id="penSize" type="range" min="1" max="18" value="4" />
        </label>
        <label class="field">
          <span class="field__label">Kleur</span>
          <input class="color" id="penColor" type="color" value="#111827" />
        </label>
        <button class="btn" id="clearBtn" type="button" title="Wis tekening op deze pagina">Wis pen</button>
        <button class="btn" id="addBookmarkBtn" type="button" title="Maak een bookmark op deze pagina">+ Bookmark</button>
        <div class="download-group" id="downloadGroup">
          <button class="btn" id="downloadBtn" type="button" aria-expanded="false" aria-controls="downloadMenu" disabled>Download ▾</button>
          <div class="download-menu" id="downloadMenu" aria-label="Downloadformaat" hidden>
            <button type="button" data-format="json">Javascript object notation (.json)</button>
            <button type="button" data-format="md">Markdown enkel (.md)</button>
            <button type="button" data-format="zip">Markdown tabladen los (.zip)</button>
            <button type="button" data-format="txt">Plain tekst (.txt)</button>
          </div>
        </div>
      </div>
    </header>

    <div class="markdown-toolbar" id="markdownToolbar" role="group" aria-label="Markdownopmaak" hidden>
      <button class="btn" type="button" data-markdown="bold" aria-label="Vet" title="Vet (Ctrl/Cmd+B)"><strong>B</strong></button>
      <button class="btn" type="button" data-markdown="italic" aria-label="Cursief" title="Cursief (Ctrl/Cmd+I)"><em>I</em></button>
      <button class="btn" type="button" data-markdown="strike" aria-label="Doorhalen" title="Doorhalen"><s>S</s></button>
      <button class="btn" type="button" data-markdown="h1" aria-label="Kop 1" title="Kop 1">H1</button>
      <button class="btn" type="button" data-markdown="h2" aria-label="Kop 2" title="Kop 2">H2</button>
      <button class="btn" type="button" data-markdown="h3" aria-label="Kop 3" title="Kop 3">H3</button>
      <button class="btn" type="button" data-markdown="ul" title="Opsomming">• Lijst</button>
      <button class="btn" type="button" data-markdown="ol" title="Genummerde lijst">1. Lijst</button>
      <button class="btn" type="button" data-markdown="checklist" title="Takenlijst">☐ Taken</button>
      <button class="btn" type="button" data-markdown="quote" title="Citaat">Citaat</button>
      <button class="btn" type="button" data-markdown="link" title="Link invoegen">Link</button>
      <button class="btn" type="button" data-markdown="code" title="Code in een regel">Code</button>
      <button class="btn" type="button" data-markdown="codeblock" title="Codeblok">Codeblok</button>
      <button class="btn" type="button" data-markdown="hr" title="Horizontale scheidingslijn">―</button>
    </div>

    <div class="hint" id="hint"></div>

    <section class="stage">
      <div class="book" id="book">
        <div class="book__shadow"></div>
        <div class="book__pages">
          <div class="page page--front" id="pageFront">
            <div class="paper">
              <div class="paper__lines"></div>
              <div class="paper__tab" id="tabFront" aria-hidden="true"></div>
              <textarea class="paper__text" id="textFront" spellcheck="false"></textarea>
              <canvas class="paper__ink" id="inkFront"></canvas>
            </div>
          </div>
          <div class="page page--back" id="pageBack" aria-hidden="true">
            <div class="paper">
              <div class="paper__lines"></div>
              <div class="paper__tab" id="tabBack" aria-hidden="true"></div>
              <textarea class="paper__text" id="textBack" spellcheck="false"></textarea>
              <canvas class="paper__ink" id="inkBack"></canvas>
            </div>
          </div>
        </div>

        <div class="bookmarks" id="bookmarks" aria-label="Bookmarks"></div>
      </div>
    </section>
  </main>

  <script src="./export.js"></script>
  <script src="./markdown.js"></script>
  <script src="./tool.js"></script>
</body>
</html>
